services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: nirka-inventory-keycloak
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: nirka-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: nirka-admin-dev
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/nirka-inventory-realm.json:/opt/keycloak/data/import/nirka-inventory-realm.json:ro
      - nirka_keycloak_data:/opt/keycloak/data

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nirka-inventory-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nirka_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.7.6
    container_name: nirka-inventory-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
      - nirka_loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    # No container healthcheck: the loki image is distroless (no shell/wget).
    # Readiness is verified externally via GET /ready on 127.0.0.1:3100.

  promtail:
    image: grafana/promtail:3.6.11
    container_name: nirka-inventory-promtail
    restart: unless-stopped
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - ../backend/api/logs:/var/log/api:ro
      - nirka_promtail_data:/positions
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.1.2-ubuntu
    container_name: nirka-inventory-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: nirka-grafana-dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - nirka_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  nirka_keycloak_data:
  nirka_prometheus_data:
  nirka_loki_data:
  nirka_promtail_data:
  nirka_grafana_data:
