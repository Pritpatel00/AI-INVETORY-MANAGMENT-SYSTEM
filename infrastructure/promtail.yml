# Ships ONLY the API process logs (job nirka-inventory-api) to Loki.
# The API runs on the host machine; its stdout is redirected to
# services/api/logs/api.log, bind-mounted read-only at /var/log/api.
#
# Future work (deliberately NOT wired up yet): correlate Stage 1 OTel trace
# IDs with these log lines using promtail's structured-metadata / derived
# labels so traces and logs can be joined in Grafana Explore.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nirka-inventory-api
    static_configs:
      - targets: [localhost]
        labels:
          job: nirka-inventory-api
          __path__: /var/log/api/*.log
